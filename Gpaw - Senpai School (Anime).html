<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gpaw · Bốn vũ trụ gối ôm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Bagel+Fat+One&family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@600;700;800&family=Bangers&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bebas+Neue&family=Oswald:wght@600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>
<style>
  :root{ --display: "Outfit", "Be Vietnam Pro", system-ui, sans-serif; --display-serif: "Lora", "Noto Serif Display", "Georgia", serif; --body: "Be Vietnam Pro", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; --ease-premium: cubic-bezier(0.32, 0.72, 0, 1); --shadow-warm: rgba(160, 140, 110, 0.12); }
  /* preload Vietnamese subset for all italic weights by using them */
  body::after { content: "Bốn vũ trụ Một xưởng gối ấ ế ố ớ ứ"; font-family: "Lora"; font-style: italic; font-weight: 400; position: absolute; left: -9999px; pointer-events: none; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--body); color: #1a1a2e; background: #f7f4ee; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px; }
  .mono { font-family: var(--mono); letter-spacing: .04em; }

  /* ───────────────────────── Sticky top nav ──────────────────────────── */
  .topnav {
    position: fixed; inset: 0 0 auto 0; z-index: 50;
    background: rgba(247,244,238,.88);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid rgba(22,33,58,.12);
    transition: background .35s ease, color .35s ease, border-color .35s ease;
  }
  .topnav.theme-anime { background: rgba(255,76,148,.92); border-color: rgba(0,0,0,.15); color: #fff; }
  .topnav.theme-stars { background: rgba(10,8,20,.85); border-color: rgba(255,255,255,.1); color: #fff; }
  .topnav.theme-plush { background: rgba(255,244,230,.9); border-color: rgba(0,0,0,.06); color: #2a1c14; }
  .topnav .wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; padding-top: 14px; padding-bottom: 14px; }
  .topnav .logo { font-family: var(--display); font-size: 22px; line-height: 1; display: inline-flex; gap: 8px; align-items: center; }
  .topnav .logo::before, .topnav .logo::after { content: "★"; font-size: 10px; color: #b3242d; }
  .topnav.theme-anime .logo::before, .topnav.theme-anime .logo::after { color: #ffea4b; }
  .topnav.theme-stars .logo::before, .topnav.theme-stars .logo::after { color: #ff3eb8; }
  .topnav.theme-plush .logo::before, .topnav.theme-plush .logo::after { color: #ff9eb1; }
  .topnav nav { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .topnav nav a {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: inherit; text-decoration: none;
    padding: 8px 12px; border-radius: 999px;
    opacity: .68; transition: opacity .15s ease, background .15s ease;
  }
  .topnav nav a:hover { opacity: 1; background: rgba(22,33,58,.06); }
  .topnav nav a.active { opacity: 1; background: rgba(22,33,58,.1); }
  .topnav.theme-anime nav a:hover, .topnav.theme-anime nav a.active { background: rgba(255,255,255,.18); }
  .topnav.theme-stars nav a:hover, .topnav.theme-stars nav a.active { background: rgba(255,255,255,.12); }
  .topnav .actions { display: flex; gap: 8px; }
  .topnav .btn {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid currentColor; background: transparent;
    cursor: pointer; color: inherit;
  }
  .topnav .btn.fill { background: #16213a; color: #f3eadb; border-color: #16213a; }
  .topnav.theme-anime .btn.fill { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
  .topnav.theme-stars .btn.fill { background: #ff3eb8; color: #fff; border-color: #ff3eb8; }
  .topnav.theme-plush .btn.fill { background: #ff9eb1; color: #fff; border-color: #ff9eb1; }

  /* ───────────────────────── Intro desk & stacked magazines ──────────────── */
  .desk-container {
    position: relative;
    background: radial-gradient(circle at 50% 20%, #46342e 0%, #1e1310 100%), #1e1310;
    padding: 120px 0 100px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 12px solid #0f0908;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.8);
  }
  .desk-container::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 4px);
    pointer-events: none;
    opacity: 0.7;
  }
  .desk-headline {
    text-align: center;
    z-index: 5;
    margin-bottom: 30px;
    color: #f5eadb;
    pointer-events: none;
  }
  .desk-headline .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #cda485;
  }
  .desk-headline h1 {
    font-family: var(--display-serif);
    font-size: clamp(38px, 5.5vw, 68px);
    line-height: 1.1;
    margin: 12px 0 8px;
    letter-spacing: -.02em;
    color: #fff;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
  }
  .desk-headline h1 em {
    font-style: italic;
    color: #eab676;
  }
  .desk-headline .sub {
    font-family: var(--body);
    font-size: 15px;
    opacity: 0.75;
    max-width: 50ch;
    margin: 0 auto;
  }
  .desk-surface {
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 480px;
    margin: 0 auto;
    perspective: 1200px;
    z-index: 2;
  }
  .magazine-stack {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  
  /* Individual magazine covers scattered on the desk */
  .desk-magazine {
    position: absolute;
    width: 220px;
    height: 300px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 4px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.45);
    cursor: pointer;
    transition: all 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
    left: calc(50% - 110px);
    top: calc(50% - 150px);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .desk-magazine:nth-child(1) {
    transform: translate3d(-150px, -40px, 10px) rotate(-16deg);
    z-index: 10;
  }
  .desk-magazine:nth-child(2) {
    transform: translate3d(120px, -60px, 20px) rotate(14deg);
    z-index: 11;
  }
  .desk-magazine:nth-child(3) {
    transform: translate3d(-40px, 60px, 30px) rotate(-8deg);
    z-index: 12;
  }
  .desk-magazine:nth-child(4) {
    transform: translate3d(130px, 70px, 40px) rotate(18deg);
    z-index: 13;
  }
  
  .desk-magazine:hover {
    transform: translate3d(0, -30px, 120px) scale(1.15) rotate(0deg) !important;
    z-index: 60 !important;
    box-shadow: 0 30px 60px rgba(0,0,0,0.65), 0 0 25px rgba(234,182,118,0.4);
  }
  
  .desk-magazine .mini-banner {
    font-family: var(--body);
    font-size: 8px;
    padding: 4px;
    text-align: center;
    background: #16213a;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .desk-magazine.politics-mini .mini-banner { background: #b3242d; }
  .desk-magazine.anime-mini .mini-banner { background: #ff4c94; }
  .desk-magazine.stars-mini .mini-banner { background: #0a0814; color: #ffd34d; }
  .desk-magazine.plush-mini .mini-banner { background: #ff9eb1; }
  
  .desk-magazine .mini-header {
    font-family: var(--display-serif);
    font-weight: 800;
    font-size: 16px;
    text-align: center;
    padding: 6px 4px;
    border-bottom: 2px solid #000;
    background: #fafafa;
  }
  .desk-magazine.politics-mini .mini-header { font-family: var(--display-serif); font-style: italic; color: #b3242d; border-color: #16213a; }
  .desk-magazine.anime-mini .mini-header { font-family: "Bagel Fat One", sans-serif; font-size: 15px; color: #0a0a0a; border-color: #0a0a0a; }
  .desk-magazine.stars-mini .mini-header { font-family: var(--display); font-style: italic; background: #0a0814; color: #fff; border-color: rgba(255,255,255,0.1); }
  .desk-magazine.plush-mini .mini-header { font-family: "Lora", serif; color: #a85e72; border-color: #ff9eb1; }
  
  .desk-magazine .mini-frame {
    flex: 1;
    background: #fdfdfd;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desk-magazine .mini-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .desk-magazine .mini-frame svg {
    width: 70%;
    height: 70%;
    opacity: 0.85;
  }
  .desk-magazine .mini-caption {
    font-family: var(--body);
    font-weight: 700;
    font-size: 11px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.9);
    text-align: center;
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  .desk-magazine .best-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: #ffea4b;
    border: 1px solid #000;
    font-family: var(--body);
    font-size: 8px;
    font-weight: 700;
    padding: 2px 4px;
    border-radius: 2px;
    transform: rotate(6deg);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.15);
  }
  
  .desk-container .scroll-hint {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(245,234,219,0.5);
    z-index: 5;
    text-align: center;
  }
  .desk-container .scroll-hint .arr {
    display: block;
    font-size: 16px;
    margin-top: 6px;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }



  /* ───────────────────────── Section frame ───────────────────────────── */
  section.world { position: relative; padding: 120px 0; overflow: hidden; }
  .world .badge-num {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .world .badge-num .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ───────────────────────── Soft page flip transition ────────────────── */
  .page-flip-container {
    position: relative;
    overflow: hidden;
  }
  .page-curl {
    position: absolute;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    background: linear-gradient(to left, 
      rgba(255,255,255,0) 0%, 
      rgba(255,255,255,0.85) 50%, 
      rgba(0,0,0,0.2) 65%, 
      rgba(255,255,255,0.95) 72%, 
      rgba(0,0,0,0.06) 80%,
      rgba(255,255,255,0) 100%
    );
    transform: translateX(110%);
    filter: drop-shadow(-10px 0 20px rgba(0,0,0,0.3));
  }
  .page-curl.active {
    animation: softPageFlip 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes softPageFlip {
    0% {
      transform: translateX(110%) skewX(0deg);
      opacity: 1;
    }
    40% {
      transform: translateX(0%) skewX(-8deg);
      opacity: 1;
    }
    100% {
      transform: translateX(-110%) skewX(0deg);
      opacity: 0;
    }
  }

  /* ════════════════════════════════════════════════════════════════════
     ❶ POLITICS — newspaper editorial style
     ════════════════════════════════════════════════════════════════════ */
  .w-politics {
    background: #f7f4ee;
    color: #16213a;
    background-image:
      radial-gradient(rgba(22,33,58,.04) 1px, transparent 1px),
      radial-gradient(rgba(22,33,58,.03) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 2px;
  }
  .w-politics .badge-num { color: #b3242d; }

  .newspaper {
    background: #f5e9d0;
    border: 2.5px solid #16213a;
    padding: 28px 32px;
    position: relative;
    box-shadow: 8px 8px 0 #16213a;
  }
  .newspaper::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent 0 23px, rgba(22,33,58,.025) 23px 24px);
    pointer-events: none;
  }
  .paper-meta-top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding-bottom: 8px; border-bottom: 1px solid #16213a;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(22,33,58,.65);
  }
  .paper-meta-top .l { text-align: left; }
  .paper-meta-top .c { text-align: center; }
  .paper-meta-top .r { text-align: right; }
  .paper-meta-top b { color: #b3242d; }

  .paper-masthead {
    text-align: center;
    border-bottom: 4px double #16213a;
    padding: 18px 0 14px;
    margin-bottom: 18px;
  }
  .paper-masthead .ornament { font-family: var(--mono); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: rgba(22,33,58,.55); margin-bottom: 8px; }
  .paper-masthead .ornament::before, .paper-masthead .ornament::after { content: " ★ "; color: #b3242d; margin: 0 8px; }
  .paper-masthead .title {
    font-family: "UnifrakturMaguntia", "Engravers Old English BT", "Old English Text MT", serif;
    font-weight: 400;
    font-size: clamp(56px, 8vw, 105px); line-height: 1.1;
    letter-spacing: -0.01em; margin: 0 0 6px;
  }
  .paper-masthead .title em { font-style: normal; color: #b3242d; }
  .paper-masthead .vi { font-family: var(--display); font-weight: 700; font-size: clamp(18px, 2vw, 26px); margin-top: 16px; letter-spacing: .04em; text-transform: uppercase; }
  .paper-masthead .vi::before, .paper-masthead .vi::after { content: " · "; color: rgba(22,33,58,.4); }

  .paper-headline {
    padding: 16px 0 22px;
    border-bottom: 1.5px solid #16213a;
    margin-bottom: 24px;
  }
  .paper-headline .banner {
    display: inline-block; background: #b3242d; color: #fff7e6;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    padding: 4px 10px; margin-bottom: 12px;
  }
  .paper-headline .head-quote {
    font-family: var(--display-serif); font-style: normal; font-weight: 700;
    font-size: clamp(24px, 2.6vw, 36px); line-height: 1.25;
    margin: 0; max-width: 38ch;
    letter-spacing: -.015em;
  }
  .paper-headline .byline { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(22,33,58,.6); margin-top: 14px; }
  .paper-headline .byline b { color: #16213a; }

  .paper-body {
    display: grid; grid-template-columns: 1.7fr 1fr;
    gap: 32px;
    align-items: start;
  }

  .paper-featured { position: relative; }
  .paper-featured .timer-cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: rgba(22,33,58,.5); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .paper-featured .timer-cap b { color: #b3242d; }

  .feat-flip {
    display: block; text-decoration: none; color: inherit;
    background: #fff7e6; border: 2px solid #16213a;
    padding: 14px;
    position: relative;
  }
  .feat-flip .tag {
    position: absolute; top: 24px; left: 24px; z-index: 3;
    background: #16213a; color: #f3eadb;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    padding: 5px 9px;
  }
  .feat-flip .tag.red { background: #b3242d; }
  .feat-flip .stamp {
    position: absolute; top: -8px; right: -14px; z-index: 3;
    background: #f5e9d0;
    border: 2px solid #b3242d; color: #b3242d;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 10px; text-align: center; line-height: 1.25;
    transform: rotate(-7deg);
  }
  .feat-flip .stamp b { display: block; font-size: 13px; }

  .feat-flip .frame {
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, #eadfc8 0%, #d9caa6 100%);
    border: 1px solid rgba(22,33,58,.18);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .feat-flip .frame.placeholder {
    background:
      repeating-linear-gradient(45deg, rgba(22,33,58,.07) 0, rgba(22,33,58,.07) 1px, transparent 1px, transparent 10px),
      linear-gradient(180deg, #eadfc8 0%, #d9caa6 100%);
    color: rgba(22,33,58,.4);
  }
  .feat-flip .frame.placeholder svg { width: 55%; height: 75%; }
  .feat-flip .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .feat-flip .cap {
    padding: 14px 4px 0; margin-top: 14px;
    border-top: 1px solid rgba(22,33,58,.2);
  }
  .feat-flip .cap-name {
    font-family: var(--display); font-weight: 700;
    font-size: 28px; line-height: 1.05; color: #16213a;
  }
  .feat-flip .cap-byline {
    font-family: var(--body); font-style: italic; font-size: 14px; font-weight: 400;
    color: rgba(22,33,58,.6); margin-top: 4px; line-height: 1.4;
  }
  .feat-flip .cap-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: rgba(22,33,58,.55); text-transform: uppercase; }
  .feat-flip .cap-row .price b { color: #b3242d; font-weight: 700; }

  .paper-thumbs { display: flex; flex-direction: column; }
  .paper-thumbs .t-head {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    border-bottom: 2px solid #16213a; padding-bottom: 8px; margin-bottom: 6px;
  }
  .thumb {
    display: grid; grid-template-columns: 84px 1fr; gap: 14px;
    background: transparent; border: 0; padding: 12px 4px;
    text-align: left; cursor: pointer; width: 100%;
    border-bottom: 1px dashed rgba(22,33,58,.25);
    transition: background .15s ease;
    color: inherit;
    font: inherit;
    position: relative;
  }
  .thumb:last-of-type { border-bottom: 1.5px solid #16213a; }
  .thumb:hover { background: rgba(22,33,58,.04); }
  .thumb.active { background: rgba(179,36,45,.08); }
  .thumb.active .t-name { color: #b3242d; }
  .thumb.active::after {
    content: "▶"; position: absolute; right: 8px;
    color: #b3242d; font-size: 9px;
  }
  .thumb .t-frame {
    width: 84px; aspect-ratio: 1 / 1.05;
    background: linear-gradient(180deg, #eadfc8 0%, #d9caa6 100%);
    border: 1px solid rgba(22,33,58,.2); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb .t-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .thumb .t-frame svg { width: 55%; height: 70%; opacity: .4; }
  .thumb .t-info { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
  .thumb .t-num { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: rgba(22,33,58,.55); }
  .thumb .t-name { font-family: var(--display); font-size: 18px; line-height: 1.1; font-weight: 700; color: #16213a; }
  .thumb .t-meta { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(22,33,58,.5); }

  .t-progress {
    height: 3px; background: rgba(22,33,58,.1); margin-top: 14px; overflow: hidden; position: relative;
  }
  .t-progress::before {
    content: ""; position: absolute; inset: 0;
    background: #b3242d;
    transform-origin: left center;
    animation: tProgress 5s linear;
  }
  @keyframes tProgress {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  .paper-foot {
